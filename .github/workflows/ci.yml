name: App CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate PR title and commit identity
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$PR_HEAD_SHA"
          node scripts/check-pr-head.mjs "$PR_TITLE" "$GITHUB_HEAD_REF" "$PR_HEAD_SHA"
      - name: Check canonical API export
        run: |
          git clone --depth 1 --branch develop https://github.com/oicrruf/estimate-api.git /tmp/estimate-api-contract
          test "$(git -C /tmp/estimate-api-contract rev-parse HEAD)" = 9f745b92bbfd2ee987471164a2e97c1ee2a87206
          python3 -m pip install uv==0.7.6
          cd /tmp/estimate-api-contract
          uv sync --frozen
          uv run --no-sync python scripts/openapi.py --check
          cd "$GITHUB_WORKSPACE"
          cmp contracts/openapi.json /tmp/estimate-api-contract/contracts/openapi.json
          node scripts/generate-contract.mjs --check --api-export /tmp/estimate-api-contract/contracts/openapi.json
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
